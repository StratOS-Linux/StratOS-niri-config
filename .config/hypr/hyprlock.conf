general {
	ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/backgrounds/StratOS/magitian/onedark_sound.png   # only png supported for now
    color = rgba(25, 20, 20, 1.0)

    # all these options are taken from hyprland, see https://wiki.hyprland.org/Configuring/Variables/#blur for explanations
    blur_passes = 1 # 0 disables blurring
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgb(62, 68, 82)
    inner_color = rgb(198, 120, 221)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = <b>I use Arch BTW!</b>
    # text = cmd[update:2000] ~/.config/hypr/scripts/hyprlock-weather
    color = rgb(97, 175, 239)
    font_size = 32
    font_family = JetBrains Mono

    position = 0, -400
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(151, 194, 119)
    font_size = 64
    font_family = JetBrains Mono

    position = 0, 400
    halign = center
    valign = center
}

